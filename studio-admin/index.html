    <div class="shell topbar-inner">
      <a class="brand" href="./" aria-label="Accueil CachiAppsStudio">
        <span>CachiAppsStudio</span>

      <div class="topbar-actions">
        <span>Administration</span>
        <a class="quiet-button" href="./securite/" data-security hidden>Sécurité</a>

    <div class="studio-interaction">
      <section class="access-panel" data-gate aria-labelledby="login-title" hidden>
        <h2 id="login-title">Connexion</h2>
        <p class="access-status" role="status" data-access-status>Vérification de la connexion…</p>
        <div class="access-actions">
          <a class="button" href="https://routestop.fr/admin/" target="_blank" rel="noreferrer" data-connect hidden>Se connecter via RouteStop</a>
          <button class="button secondary" type="button" data-refresh-access hidden>Vérifier ma connexion</button>
          <a class="button" href="https://admin.cachiappsstudio.fr/securite/" data-enroll-link hidden>Configurer le code</a>
        </div>
        <form class="form signin-form" method="post" data-login hidden>
          <label>Adresse e-mail<input type="email" name="email" autocomplete="username" required></label>
          <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
          <button class="button" type="submit">Se connecter <span aria-hidden="true">→</span></button>
        </form>
      </section>
      <noscript><p>Active JavaScript pour ouvrir l’administration.</p></noscript>
      <p class="message warning access-error" role="alert" data-session-error hidden></p>
      <section class="projects" data-workspace hidden aria-labelledby="projects-title">
        <h2 id="projects-title">Applications</h2>
        <div class="project-index">
          <a class="project-row route-project" href="./routestop/" data-route hidden>
            <img class="project-icon" src="./assets/icon.png" alt="" width="58" height="58">
            <div class="project-copy">
              <h3>RouteStop</h3>
              <p>Tableau de bord</p>
            </div>
            <span class="project-arrow" aria-hidden="true">→</span>
          </a>
          <a class="project-row pod-project" href="./podlegacy/" data-pod hidden>
            <img class="project-icon" src="./podlegacy-icon.png" alt="" width="58" height="58">
            <div class="project-copy">
              <h3>PodLegacy</h3>
              <p>Incidents, versions et téléchargements</p>
            </div>
            <span class="project-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </section>
    </div>
