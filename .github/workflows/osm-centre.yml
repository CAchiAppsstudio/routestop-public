name: OSM Centre daily extract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/osm-centre.yml'
      - 'scripts/osm-centre-extract.py'
      - 'scripts/osm-regions-extract.py'
      - 'scripts/osm-regions.json'
      - 'scripts/osm-extracts-current.py'
      - 'scripts/osm-download.py'
  schedule:
    - cron: '37 1 * * *'
    - cron: '17 11 * * *'
permissions:
  contents: write
concurrency:
  group: osm-centre
  cancel-in-progress: false
jobs:
  extract:
    if: github.repository == 'CAchiAppsstudio/routestop-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check whether all regional sources are already current
        id: freshness
        run: python3 scripts/osm-extracts-current.py
      - name: Check resources and install parser
        if: steps.freshness.outputs.current != 'true'
        run: |
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -gt 10000000000
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          python3 -m venv "$RUNNER_TEMP/osm-venv"
          "$RUNNER_TEMP/osm-venv/bin/pip" install --no-cache-dir osmium==4.3.2
      - name: Download public OSM data
        if: steps.freshness.outputs.current != 'true'
        run: |
          python3 scripts/osm-download.py "$RUNNER_TEMP/osm-centre"
          cd "$RUNNER_TEMP/osm-centre"
          DATA_AS_OF="$(osmium fileinfo -g header.option.osmosis_replication_timestamp france.osm.pbf)"
          [[ "$DATA_AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          echo "DATA_AS_OF=$DATA_AS_OF" >> "$GITHUB_ENV"
      - name: Extract Centre without querying Overpass
        if: steps.freshness.outputs.current != 'true'
        run: |
          cd "$RUNNER_TEMP/osm-centre"
          osmium extract --bbox=0.97,44.37,4.23,47.53 --strategy=smart france.osm.pbf -o centre.osm.pbf
          osmium tags-filter centre.osm.pbf nwr/highway=services w/highway=motorway \
            nwr/amenity=fuel,fast_food,restaurant,cafe,food_court,bar,ice_cream,charging_station nwr/shop \
            -o selected.osm.pbf
          rm centre.osm.pbf
      - name: Validate and produce the small public snapshot
        if: steps.freshness.outputs.current != 'true'
        run: |
          "$RUNNER_TEMP/osm-venv/bin/python" scripts/osm-centre-extract.py \
            "$RUNNER_TEMP/osm-centre/selected.osm.pbf" data/osm/centre.json --data-as-of "$DATA_AS_OF"
      - name: Save only validated public OSM data
        if: steps.freshness.outputs.current != 'true'
        run: |
          git config user.name 'RouteStop OSM refresh'
          git config user.email 'actions@users.noreply.github.com'
          git add data/osm/centre.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(osm): refresh Centre from Geofabrik'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build validated extracts for other regions
        if: steps.freshness.outputs.current != 'true'
        id: regions
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/osm-venv/bin/python" scripts/osm-regions-extract.py \
            "$RUNNER_TEMP/osm-centre/france.osm.pbf" data/osm/regions --data-as-of "$DATA_AS_OF"
      - name: Save only validated regional data
        if: always() && (steps.regions.outcome == 'success' || steps.regions.outcome == 'failure')
        run: |
          if [ -d data/osm/regions ]; then
            git add data/osm/regions
            if ! git diff --cached --quiet; then
              git commit -m 'data(osm): refresh validated regional extracts'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Report any regional extraction failure
        if: steps.regions.outcome == 'failure'
        run: exit 1
      - name: Remove temporary extracts
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/osm-centre" "$RUNNER_TEMP/osm-venv"
